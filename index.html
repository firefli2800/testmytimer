<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Display</title>
<style>
/* [styles unchanged] */
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff; font-family:Arial,sans-serif;overflow:hidden;}
#rotateStage{position:fixed;top:50%;left:50%;width:100vh;height:100vw;
  transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center center;
  background:linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
             url("./ChatGPT Image May 1, 2026, 02_05_25 AM.png") center/cover no-repeat;
  overflow:hidden;
}
#appShell{position:absolute;inset:0;z-index:1;display:grid;grid-template-rows:110px 1fr 160px 1fr;background:transparent;}
#topBar{display:flex;align-items:center;justify-content:space-between;padding:0 30px;
  background:rgba(0,0,0,.68);border-bottom:3px solid rgba(255,255,255,.18);z-index:20;backdrop-filter:blur(2px);}
#stationBadge{font-size:34px;font-weight:bold;letter-spacing:.5px;}
#roundBadge{font-size:28px;font-weight:bold;text-align:right;line-height:1.1;white-space:pre-line;}
.videoWrap{position:relative;width:100%;height:100%;background:transparent;overflow:hidden;}
video{width:100%;height:100%;object-fit:contain;background:transparent;}
.videoName{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
  padding:12px 22px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.22);border-radius:10px;
  font-size:30px;font-weight:bold;letter-spacing:.3px;text-align:center;width:auto;
  max-width:92%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.08;
  text-shadow:0 0 14px rgba(0,0,0,.8);
}
#timerBar{display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.18);border-top:3px solid rgba(255,255,255,.18);
  border-bottom:3px solid rgba(255,255,255,.18);z-index:25;backdrop-filter:none;}
#timer{font-size:104px;line-height:1;font-weight:bold;letter-spacing:2px;text-shadow:0 0 24px rgba(0,0,0,.85);}
#appShell.single{grid-template-rows:110px 1fr 160px;}
#appShell.single #videoWrap1{display:block;}
#appShell.single #videoWrap2{display:none;}
#appShell.dual #videoWrap1,#appShell.dual #videoWrap2{display:block;}
#appShell.none #videoWrap1,#appShell.none #videoWrap2{display:none;}
#center{position:absolute;inset:0;z-index:30;font-size:84px;line-height:1.1;text-align:center;
  white-space:pre-line;text-shadow:0 0 28px rgba(0,0,0,.95);display:none;font-weight:bold;
  align-items:center;justify-content:center;pointer-events:none;color:#fff;padding:40px;}
#upcomingLabel{position:absolute;left:50%;top:132px;transform:translateX(-50%);z-index:35;
  display:none;padding:10px 20px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;font-size:34px;font-weight:bold;letter-spacing:1px;text-align:center;
  text-shadow:0 0 18px rgba(0,0,0,.9);pointer-events:none;}
</style>
</head>
<body>

<div id="rotateStage">
  <div id="appShell" class="none">
    <div id="topBar">
      <div id="stationBadge"></div>
      <div id="roundBadge"></div>
    </div>
    <div id="videoWrap1" class="videoWrap">
      <video id="video1" muted playsinline preload="auto" loop></video>
      <div id="videoName1" class="videoName"></div>
    </div>
    <div id="timerBar"><div id="timer"></div></div>
    <div id="videoWrap2" class="videoWrap">
      <video id="video2" muted playsinline preload="auto" loop></video>
      <div id="videoName2" class="videoName"></div>
    </div>
  </div>
  <div id="center"></div>
  <div id="upcomingLabel">NEXT UP</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

<script>
//=== Firebase Initialization ===
const firebaseConfig = {
  apiKey: "AIzaSyAR7B5phYOnasZkBQyqut56i_DKA8HFJz0",
  authDomain: "timer-app-30e7d.firebaseapp.com",
  databaseURL: "https://timer-app-30e7d-default-rtdb.firebaseio.com",
  projectId: "timer-app-30e7d",
  storageBucket: "timer-app-30e7d.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
// (We remove resolveYMoveVideo and related logic entirely.)

//=== Elements and State ===
const stationBadge = document.getElementById("stationBadge");
const roundBadge   = document.getElementById("roundBadge");
const timerEl      = document.getElementById("timer");
const centerEl     = document.getElementById("center");
const upcomingLabel= document.getElementById("upcomingLabel");
const appShell     = document.getElementById("appShell");
const video1       = document.getElementById("video1");
const video2       = document.getElementById("video2");
const videoName1   = document.getElementById("videoName1");
const videoName2   = document.getElementById("videoName2");
const videos       = [video1, video2];
const videoNames   = [videoName1, videoName2];

// Application state (initialized with defaults)
let state = { startAt: 0, paused: true, elapsed: 0 };
let workoutConfig = null;
let serverTimeOffset = 0;

// Caches and context keys for video synchronization
let activeSources = ["",""];
let activeContextKeys = ["",""];
let pendingLoadIds = [0,0];
let renderToken = 0;

//=== Service Worker for Caching (registration) ===
// We register a service worker (sw.js) to enable video caching and offline support.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => console.log('ServiceWorker registered:', reg))
    .catch(err => console.error('SW registration failed:', err));
}

//=== Helper Functions ===

// Normalize an action item into an object with storage path and name
function normalizeAction(value) {
  if (!value) return { source: "firebase", path: "", name: "" };
  if (typeof value === "string") {
    return { source: "firebase", path: value, name: decodeURIComponent(value.split("/").pop()).replace(/\.[^/.]+$/,"") };
  }
  // Ignore any non-firebase/ymove formats; default to firebase.
  return { source: "firebase", path: value.path || "", name: value.name || decodeURIComponent((value.path||"").split("/").pop()) };
}

// Build timeline from workoutConfig (unchanged logic, except normalized actions no longer include YMove)
function buildTimeline() {
  const config = workoutConfig || {};
  const segments = [];
  if (!config.loopBlocks && config.includeWarmup) {
    segments.push({ kind: "singleVideo", duration: config.warmupSeconds || 180, label: "WARMUP",
                    item: normalizeAction(config.warmupPath) });
  }
  (config.blocks||[]).forEach((block, blockIndex) => {
    const rounds = block.rounds || 3;
    for (let roundIndex = 1; roundIndex <= rounds; roundIndex++) {
      segments.push({ kind: "dualVideo", duration: block.workSeconds || 45,
                      blockIndex, roundIndex, rounds, label: `ROUND ${roundIndex} OF ${rounds}` });
      if (block.restSeconds > 0) {
        segments.push({ kind: "rest", duration: block.restSeconds, blockIndex, roundIndex, rounds, label: "REST" });
      }
    }
    if (block.breakSeconds > 0) {
      segments.push({ kind: "break", duration: block.breakSeconds, blockIndex, label: "BREAK" });
    }
  });
  if (!config.loopBlocks && config.includeCooldown) {
    segments.push({ kind: "singleVideo", duration: config.cooldownSeconds || 180, label: "STRETCH",
                    item: normalizeAction(config.cooldownPath) });
  }
  return segments;
}

// Get total duration in ms
function getTotalDurationMs() {
  return getTimeline().reduce((sum, seg) => sum + (seg.duration * 1000), 0);
}

// Get elapsed ms using server-corrected time
function getElapsedMs() {
  const total = getTotalDurationMs();
  if (state.paused) {
    return Math.max(0, Math.min((state.elapsed||0)*1000, total)); 
  }
  // Using serverTimeOffset to correct clock skew【18†L229-L238】【18†L243-L251】
  const now = Date.now() + serverTimeOffset;
  let elapsed = now - state.startAt;
  if (!workoutConfig.loopBlocks) {
    return Math.max(0, Math.min(elapsed, total));
  }
  // Looping mode: mod by total
  return ((elapsed % total) + total) % total;
}

// Locate current segment and position
function locateSegment(elapsedMs) {
  const timeline = getTimeline();
  let cursor = 0;
  for (let i = 0; i < timeline.length; i++) {
    const seg = timeline[i];
    const segMs = seg.duration * 1000;
    if (elapsedMs < cursor + segMs) {
      return { index: i, segment: seg, segmentElapsedMs: elapsedMs - cursor, finished: (elapsedMs >= getTotalDurationMs()) };
    }
    cursor += segMs;
  }
  // If past end, return last segment
  const last = timeline[timeline.length - 1] || {kind:"none", duration:0, label:""};
  return { index: timeline.length - 1, segment: last, segmentElapsedMs: last.duration*1000, finished: true };
}

// Resolve a video item to its URL and name
async function resolveVideoItem(item) {
  if (!item || item.source !== "firebase") {
    return { url: null, name: "", key: "" };
  }
  try {
    const url = item.path ? await storage.ref(item.path).getDownloadURL() : null;
    return { url, name: item.name || "", key: `firebase:${item.path}` };
  } catch (error) {
    console.error("Failed to load video path:", item.path, error);
    return { url: null, name: item.name || "", key: `firebase:${item.path}` };
  }
}

// Get upcoming video info for NEXT UP preview
async function buildNextUpRequest(currentIndex, segment, remain, finished) {
  const timeline = getTimeline();
  for (let i = currentIndex + 1; i < timeline.length; i++) {
    const nextSeg = timeline[i];
    if (nextSeg.kind === "dualVideo") {
      const items = getDualVideoItems(nextSeg);
      const resolved = await Promise.all(items.map(resolveVideoItem));
      if (resolved[0].url || resolved[1].url) {
        return {
          mode: "dual",
          sourceUrls: [resolved[0].url, resolved[1].url],
          names: [resolved[0].name, resolved[1].name],
          contextKey: `preview:${currentIndex}:${resolved.map(r=>r.key).join("|")}`,
          seekSeconds: 0,
          shouldPlay: !state.paused && (!finished || workoutConfig.loopBlocks),
          centerText: "", upcoming: true, labelText: "NEXT",
          segment, remain
        };
      }
    }
    if (nextSeg.kind === "singleVideo") {
      const item = getSingleVideoItem(nextSeg);
      const resolved = await resolveVideoItem(item);
      if (resolved.url) {
        return {
          mode: "single",
          sourceUrls: [resolved.url, null],
          names: [resolved.name, ""],
          contextKey: `preview:${currentIndex}:${resolved.key}`,
          seekSeconds: 0,
          shouldPlay: !state.paused && (!finished || workoutConfig.loopBlocks),
          centerText: "", upcoming: true, labelText: "NEXT",
          segment, remain
        };
      }
    }
  }
  // If loopBlocks, try from beginning
  if (workoutConfig.loopBlocks) {
    const firstSeg = timeline.find(s => s.kind==="dualVideo"||s.kind==="singleVideo");
    if (firstSeg) {
      const items = firstSeg.kind==="dualVideo" ? getDualVideoItems(firstSeg) : [getSingleVideoItem(firstSeg)];
      const resolved = await Promise.all(items.map(resolveVideoItem));
      if (resolved.some(r => r.url)) {
        const mode = firstSeg.kind==="dualVideo" ? "dual" : "single";
        return {
          mode,
          sourceUrls: [resolved[0].url, resolved[1]?.url],
          names: [resolved[0].name, resolved[1]?.name],
          contextKey: `preview:${currentIndex}:loop`,
          seekSeconds: 0,
          shouldPlay: !state.paused,
          centerText: "", upcoming: true, labelText: "NEXT",
          segment: firstSeg, remain
        };
      }
    }
  }
  return null;
}

// Build the media request for the current timeline segment
async function buildMediaRequest({index, segment, segmentElapsedMs, finished}) {
  const remainSec = Math.max(0, Math.ceil(segment.duration - segmentElapsedMs/1000));
  try {
    if (segment.kind === "rest") {
      const breakSec = (workoutConfig.blocks[segment.blockIndex]?.breakSeconds || 0);
      // If no break screen, show NEXT UP in last 10s of REST
      if (breakSec <= 0 && remainSec <= 10) {
        const nextUp = await buildNextUpRequest(index, segment, remainSec, finished);
        if (nextUp) return nextUp;
      }
      return { mode: "none", centerText: "REST", upcoming: false, labelText: "REST", segment, remain: remainSec };
    }
    if (segment.kind === "break") {
      // If break has NEXT UP last 15s
      if (remainSec <= 15) {
        const nextUp = await buildNextUpRequest(index, segment, remainSec, finished);
        if (nextUp) return nextUp;
      }
      return { mode: "none", centerText: "BREAK", upcoming: false, labelText: "BREAK", segment, remain: remainSec };
    }
    if (segment.kind === "singleVideo") {
      const item = getSingleVideoItem(segment);
      const res = await resolveVideoItem(item);
      return {
        mode: res.url ? "single" : "none",
        sourceUrls: [res.url, null],
        names: [res.name, ""],
        contextKey: `segment:${index}:${res.key}`,
        seekSeconds: segmentElapsedMs/1000,
        shouldPlay: !state.paused && (!finished || workoutConfig.loopBlocks),
        centerText: res.url ? "" : "MISSING\nVIDEO",
        upcoming: false,
        labelText: segment.label,
        segment, remain: remainSec
      };
    }
    if (segment.kind === "dualVideo") {
      const items = getDualVideoItems(segment);
      const resolved = await Promise.all(items.map(resolveVideoItem));
      const hasVideo = resolved[0].url || resolved[1].url;
      return {
        mode: hasVideo ? "dual" : "none",
        sourceUrls: [resolved[0].url, resolved[1].url],
        names: [resolved[0].name, resolved[1].name],
        contextKey: `segment:${index}:${resolved.map(r=>r.key).join("|")}`,
        seekSeconds: segmentElapsedMs/1000,
        shouldPlay: !state.paused && (!finished || workoutConfig.loopBlocks),
        centerText: hasVideo ? "" : "MISSING\nVIDEOS",
        upcoming: false,
        labelText: segment.label,
        segment, remain: remainSec
      };
    }
  } catch (err) {
    console.error("Error in buildMediaRequest:", err);
  }
  // Default fallback if something goes wrong
  return { mode: "none", centerText: "", upcoming: false, labelText: "", segment, remain: remainSec };
}

// Play/pause and load helper for video elements
function safePlay(video) {
  if (!video) return;
  video.play().catch(err => console.warn("Play aborted:", err));
}
function clampSeek(video, sec) {
  if (video && Number.isFinite(video.duration)) {
    return Math.max(0, Math.min(sec, video.duration - 0.1));
  }
  return Math.max(0, sec);
}
function seekVideo(video, sec) {
  if (!video || !Number.isFinite(sec)) return;
  video.currentTime = clampSeek(video, sec);
}
function stopUnusedVideos(activeCount) {
  videos.forEach((vid, i) => {
    if (i >= activeCount) {
      vid.pause();
      vid.removeAttribute("src");
      vid.load();
      activeSources[i] = "";
      activeContextKeys[i] = "";
      videoNames[i].innerText = "";
    }
  });
}
function loadSource(slotIndex, request, srcUrl) {
  const vid = videos[slotIndex];
  pendingLoadIds[slotIndex] += 1;
  const loadId = pendingLoadIds[slotIndex];
  function onReady() {
    vid.removeEventListener("loadedmetadata", onReady);
    vid.removeEventListener("canplay", onReady);
    if (loadId !== pendingLoadIds[slotIndex]) return;
    seekVideo(vid, request.seekSeconds);
    if (request.shouldPlay) safePlay(vid);
    else vid.pause();
  }
  vid.pause();
  vid.addEventListener("loadedmetadata", onReady);
  vid.addEventListener("canplay", onReady);
  vid.src = srcUrl || "";
  vid.load();
}
function syncVideoSlot(slotIndex, request, srcUrl) {
  const vid = videos[slotIndex];
  if (!srcUrl) { 
    vid.pause(); vid.removeAttribute("src"); vid.load();
    activeSources[slotIndex] = ""; activeContextKeys[slotIndex] = "";
    return;
  }
  const contextKey = `${request.contextKey}:slot${slotIndex}`;
  const srcChanged = (srcUrl !== activeSources[slotIndex]);
  const contextChanged = (contextKey !== activeContextKeys[slotIndex]);
  activeContextKeys[slotIndex] = contextKey;
  vid.loop = true;
  if (srcChanged) {
    activeSources[slotIndex] = srcUrl;
    loadSource(slotIndex, request, srcUrl);
  } else if (contextChanged) {
    seekVideo(vid, request.seekSeconds);
  }
  if (request.shouldPlay && vid.paused) safePlay(vid);
  if (!request.shouldPlay && !vid.paused) vid.pause();
}
function syncVideos(request) {
  const activeCount = (request.mode === "dual" ? 2 : 1);
  stopUnusedVideos(activeCount);
  for (let i=0; i<activeCount; i++) {
    syncVideoSlot(i, request, request.sourceUrls[i]);
  }
}
function setVideoLayout(request) {
  appShell.className = "";
  if (request.mode === "none") {
    appShell.classList.add("none");
    videos.forEach(v => v.pause());
    videoNames.forEach(n => n.innerText = "");
    return;
  }
  appShell.classList.add(request.mode);
  videoName1.innerText = request.names[0] || "";
  videoName2.innerText = (request.mode==="dual" ? (request.names[1] || "") : "");
}

// Format seconds as MM:SS
function formatTime(totalSec) {
  const sec = Math.max(0, Math.floor(totalSec));
  const mm = String(Math.floor(sec/60)).padStart(2,"0");
  const ss = String(sec%60).padStart(2,"0");
  return `${mm}:${ss}`;
}

// Main render function (throttled by setInterval below)
async function render() {
  const token = ++renderToken;
  if (!workoutConfig) {
    // No workout loaded yet
    stationBadge.innerText = `STATION ${screenNumber}`;
    roundBadge.innerText = "";
    timerEl.innerText = "--:--";
    centerEl.innerText = "LOADING\nWORKOUT";
    centerEl.style.display = "flex";
    upcomingLabel.style.display = "none";
    appShell.className = "none";
    videos.forEach(v => v.pause());
    return;
  }
  try {
    const info = locateSegment(getElapsedMs());
    const request = await buildMediaRequest(info);
    if (token !== renderToken) return; // stale
    stationBadge.innerText = `STATION ${screenNumber}`;
    roundBadge.innerText = getDisplayLabel(request.segment, request.labelText, request.upcoming);
    timerEl.innerText = formatTime(request.remain);
    centerEl.innerText = request.centerText || "";
    centerEl.style.display = request.centerText ? "flex" : "none";
    upcomingLabel.style.display = request.upcoming ? "block" : "none";
    setVideoLayout(request);
    if (request.mode !== "none") {
      syncVideos(request);
    }
  } catch(err) {
    console.error("Render error:", err);
  }
}

//=== Timer and Data Sync ===
// Listen for server time offset to correct clock skew【18†L229-L238】
db.ref(".info/serverTimeOffset").on("value", snap => {
  serverTimeOffset = snap.val() || 0;
});

// Listen for display state changes
db.ref("state").on("value", snap => {
  const data = snap.val() || {};
  // Use server-synced startAt; do not override with local Date.now()
  state = {
    startAt: data.startAt || 0,
    paused: data.paused === undefined ? true : data.paused,
    elapsed: data.elapsed || 0
  };
  console.log("State updated:", state);
  render();
}, err => console.error("State listener error:", err));

// Listen for workout configuration changes
db.ref("workoutConfig").on("value", snap => {
  workoutConfig = snap.val() || {};
  activeSources = ["",""];
  activeContextKeys = ["",""];
  console.log("Config updated:", workoutConfig);
  render();
}, err => console.error("Config listener error:", err));

// Initial render
render();
setInterval(render, 250);
</script>
</body>
</html>
