<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Workout Controller</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  padding:24px;
  max-width:900px;
  margin:0 auto;
}

h1,h2{
  margin-top:0;
}

.panel{
  background:#171717;
  border:1px solid #333;
  border-radius:12px;
  padding:16px;
  margin:16px 0;
}

button{
  padding:14px 20px;
  font-size:18px;
  font-weight:bold;
  border-radius:10px;
  border:1px solid #555;
  cursor:pointer;
  margin:8px;
}

button.primary{
  background:#fff;
  color:#000;
}

button.secondary{
  background:#222;
  color:#fff;
}

button.danger{
  background:#401111;
  color:#fff;
  border-color:#8a3333;
}

#timer{
  font-size:72px;
  font-weight:bold;
  margin:16px 0;
}

#status{
  color:#bbb;
  margin-top:10px;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

.small{
  color:#aaa;
  font-size:14px;
}
</style>
</head>
<body>

<h1>Workout Controller</h1>

<div class="panel">
  <h2>Live Timer</h2>
  <div id="timer">--:--</div>
  <div id="status">Loading...</div>

  <div class="row">
    <button class="primary" onclick="playWorkout()">Play</button>
    <button class="secondary" onclick="pauseWorkout()">Pause</button>
    <button class="danger" onclick="resetWorkout()">Reset</button>
  </div>

  <div class="row">
    <button class="secondary" onclick="skipSeconds(-15)">Back 15s</button>
    <button class="secondary" onclick="skipSeconds(15)">Forward 15s</button>
  </div>

  <p class="small">
    This controller uses Firebase server time so all displays calculate from the same clock.
  </p>
</div>

<div class="panel">
  <h2>State Debug</h2>
  <pre id="debug">{}</pre>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAR7B5phYOnasZkBQyqut56i_DKA8HFJz0",
  authDomain: "timer-app-30e7d.firebaseapp.com",
  databaseURL: "https://timer-app-30e7d-default-rtdb.firebaseio.com",
  projectId: "timer-app-30e7d",
  storageBucket: "timer-app-30e7d.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");

let workoutConfig = null;
let state = {
  paused: true,
  startAt: 0,
  elapsedMs: 0,
  updatedAt: 0
};

let serverTimeOffset = 0;

function numberOrDefault(value, fallback) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function emptyAction() {
  return {
    source: "firebase",
    path: "",
    name: ""
  };
}

function defaultWorkoutConfig() {
  return {
    includeWarmup: true,
    includeCooldown: true,
    loopBlocks: false,
    warmupSeconds: 180,
    cooldownSeconds: 180,
    warmupPath: "",
    cooldownPath: "",
    blocks: Array.from({ length: 6 }, () => ({
      workSeconds: 45,
      restSeconds: 15,
      rounds: 3,
      breakSeconds: 0,
      stations: [
        [emptyAction(), emptyAction()],
        [emptyAction(), emptyAction()],
        [emptyAction(), emptyAction()]
      ]
    }))
  };
}

function normalizeConfig(config) {
  return {
    ...defaultWorkoutConfig(),
    ...(config || {}),
    blocks: (config?.blocks || defaultWorkoutConfig().blocks)
  };
}

function buildTimeline() {
  const config = workoutConfig || defaultWorkoutConfig();
  const segments = [];

  if (!config.loopBlocks && config.includeWarmup !== false) {
    segments.push({
      kind: "warmup",
      duration: numberOrDefault(config.warmupSeconds, 180)
    });
  }

  (config.blocks || []).forEach((block) => {
    const rounds = numberOrDefault(block.rounds, 3);
    const workSeconds = numberOrDefault(block.workSeconds, 45);
    const restSeconds = numberOrDefault(block.restSeconds, 15);
    const breakSeconds = numberOrDefault(block.breakSeconds, 0);

    for (let i = 0; i < rounds; i += 1) {
      segments.push({ kind: "work", duration: workSeconds });

      if (restSeconds > 0) {
        segments.push({ kind: "rest", duration: restSeconds });
      }
    }

    if (breakSeconds > 0) {
      segments.push({ kind: "break", duration: breakSeconds });
    }
  });

  if (!config.loopBlocks && config.includeCooldown !== false) {
    segments.push({
      kind: "cooldown",
      duration: numberOrDefault(config.cooldownSeconds, 180)
    });
  }

  return segments;
}

function getTotalDurationMs() {
  return buildTimeline().reduce((sum, segment) => sum + segment.duration * 1000, 0);
}

function getServerNow() {
  return Date.now() + serverTimeOffset;
}

function getElapsedMs() {
  const total = getTotalDurationMs();

  let elapsed = state.paused
    ? numberOrDefault(state.elapsedMs, 0)
    : getServerNow() - numberOrDefault(state.startAt, getServerNow());

  elapsed = Math.max(0, elapsed);

  if (workoutConfig?.loopBlocks && total > 0) {
    return elapsed % total;
  }

  return Math.min(elapsed, total);
}

function format(totalSeconds) {
  const safe = Math.max(0, Math.floor(totalSeconds));
  const minutes = Math.floor(safe / 60);
  const seconds = safe % 60;
  return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function render() {
  const elapsedMs = getElapsedMs();
  const totalMs = getTotalDurationMs();

  let remainingMs;

  if (workoutConfig?.loopBlocks && totalMs > 0) {
    remainingMs = totalMs - elapsedMs;
  } else {
    remainingMs = Math.max(0, totalMs - elapsedMs);
  }

  timerEl.textContent = format(Math.ceil(remainingMs / 1000));

  statusEl.textContent = state.paused
    ? "Paused"
    : "Running";

  debugEl.textContent = JSON.stringify({
    state,
    serverTimeOffset,
    elapsedMs,
    totalMs,
    loopBlocks: workoutConfig?.loopBlocks === true
  }, null, 2);
}

function playWorkout() {
  const elapsedMs = getElapsedMs();

  db.ref("state").update({
    paused: false,
    startAt: firebase.database.ServerValue.TIMESTAMP,
    elapsedMs,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    /*
      Important:
      ServerValue.TIMESTAMP becomes the timestamp of the write.
      Displays use startAt + elapsedMs correction by subtracting elapsedMs.
      We store elapsedMs separately so resume does not lose place.
    */
    return db.ref("state").once("value");
  }).then(snap => {
    const data = snap.val() || {};
    if (data.startAt && elapsedMs > 0) {
      return db.ref("state").update({
        startAt: data.startAt - elapsedMs
      });
    }
  }).catch(err => {
    statusEl.textContent = "Play error: " + err.message;
  });
}

function pauseWorkout() {
  const elapsedMs = getElapsedMs();

  db.ref("state").update({
    paused: true,
    elapsedMs,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(err => {
    statusEl.textContent = "Pause error: " + err.message;
  });
}

function resetWorkout() {
  db.ref("state").set({
    paused: true,
    startAt: 0,
    elapsedMs: 0,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(err => {
    statusEl.textContent = "Reset error: " + err.message;
  });
}

function skipSeconds(seconds) {
  const total = getTotalDurationMs();
  const nextElapsed = Math.max(0, Math.min(getElapsedMs() + seconds * 1000, total));

  if (state.paused) {
    db.ref("state").update({
      paused: true,
      elapsedMs: nextElapsed,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  } else {
    db.ref("state").update({
      paused: false,
      startAt: getServerNow() - nextElapsed,
      elapsedMs: nextElapsed,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }
}

db.ref(".info/serverTimeOffset").on("value", snap => {
  serverTimeOffset = snap.val() || 0;
  render();
});

db.ref("state").on("value", snap => {
  state = {
    paused: true,
    startAt: 0,
    elapsedMs: 0,
    updatedAt: 0,
    ...(snap.val() || {})
  };

  /*
    Backward compatibility:
    If older state used elapsed instead of elapsedMs, convert it safely.
  */
  if (!state.elapsedMs && state.elapsed) {
    state.elapsedMs = state.elapsed;
  }

  render();
});

db.ref("workoutConfig").on("value", snap => {
  workoutConfig = normalizeConfig(snap.val());
  render();
});

render();
setInterval(render, 250);
</script>

</body>
</html>
